<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuotePro — quotation and invoice management for Sri Lankan businesses" />
    <title>QuotePro</title>
    <!--
      Applies the saved theme before React loads so dark-mode users never see a
      white flash. Must stay in sync with STORAGE_KEYS.theme in src/config/constants.ts.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('quotepro:theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || ((saved === null || saved === 'system') && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
